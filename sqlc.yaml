version: "2"
models:
  - id: "pg"
    engine: "postgresql"
    schema: "sql/schema"
    queries: "sql/queries"
    gen:
      go:
        out: "internal/db"
        package: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
